[project]
name = "motion-forecast"
version = "0.1.0"
description = "Predicts whether the Swiss Federal Council proposes to accept a Motion or Postulat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "motion_forecast"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
